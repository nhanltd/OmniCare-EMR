name: OmniCare EMR Continuous Integration

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  backend-build-and-test:
    name: Build & Test (Java 17 Spring Boot API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'omnicare-emr-api/pom.xml'

      - name: Compile and Run All Tests with Maven
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          mvn clean test -f omnicare-emr-api/pom.xml --batch-mode

      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: omnicare-emr-api/target/surefire-reports/
          retention-days: 7
